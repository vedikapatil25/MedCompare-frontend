<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedCompare - Dark Mode</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="navbar"></div>
<script src="/navbar/nav.js"></script>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Compare Medicine & Lab Test Prices</h1>
    <p>Find the best deals on trusted pharmacies and labs near you.</p>
    <input type="text" placeholder="Search medicine or lab test..." />
    <button class="compare-btn">Compare Now</button>
  </section>

  <!-- Carousel Section -->
  <div class="carousel-container">
    <button class="prev-btn">&#10094;</button>

    <div class="carousel">
      <img id="img1" src="../images/img1.webp">
      <img id="img2" src="../images/img2.webp">
      <img id="img3" src="../images/img3.webp">
      <img id="img4" src="../images/img4.webp">
    </div>

    <button class="next-btn">&#10095;</button>
  </div>

  <!-- Popular Section -->
  <section class="popular">
    <h2>Popular Medicines</h2>
    <div class="cards" id="medicineList"></div>
    <!-- <div class="cards">
      <div class="card">Paracetamol</div>
      <div class="card">Dolo 650</div>
      <div class="card">Azithromycin</div>
      <div class="card">Amoxicillin</div>
    </div> -->
  </section>

  <!-- Footer -->
  <div id="footer"></div>
    <!-- Load Footer -->
   <script>
     // Load Footer
  fetch("../footer/footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    });
   </script>

  <!-- Toggle Button -->
  <button id="toggleMode">🌙 Toggle Mode</button>

  <script src="script.js"></script>
</body>
</html>
