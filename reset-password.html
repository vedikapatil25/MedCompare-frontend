<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MedCompare</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .logo { color: #3b82f6; font-size: 22px; font-weight: bold; }

        h2 { color: #0f172a; font-size: 20px; }

        p { color: #6b7280; font-size: 13px; }

        label { font-size: 13px; color: #374151; display: block; margin-bottom: 6px; }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus { border-color: #3b82f6; }

        .password-wrapper { position: relative; }

        .password-wrapper input { padding-right: 44px; }

        .toggle-eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #6b7280;
        }

        .submit-btn {
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover { background: #1d4ed8; }

        #successMsg {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 14px;
            color: #15803d;
            font-size: 14px;
            text-align: center;
        }

        #errorMsg {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 14px;
            color: #dc2626;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">MedCompare</div>
    <h2>Set New Password</h2>
    <p>Enter a strong new password for your account.</p>

    <div>
        <label>New Password</label>
        <div class="password-wrapper">
            <input type="password" id="newPassword" placeholder="Enter new password">
            <button class="toggle-eye" onclick="togglePwd('newPassword', this)">👁️</button>
        </div>
    </div>

    <div>
        <label>Confirm Password</label>
        <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="Confirm new password">
            <button class="toggle-eye" onclick="togglePwd('confirmPassword', this)">👁️</button>
        </div>
    </div>

    <button class="submit-btn" onclick="resetPassword()">Reset Password</button>

    <div id="successMsg">✅ Password reset successful! Redirecting to home...</div>
    <div id="errorMsg"></div>
</div>

<script>
    // Read token from URL
    function getTokenFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get("token");
    }

    function togglePwd(id, btn) {
        const input = document.getElementById(id);
        if (input.type === "password") {
            input.type = "text";
            btn.textContent = "🙈";
        } else {
            input.type = "password";
            btn.textContent = "👁️";
        }
    }

    function resetPassword() {
        const token = getTokenFromURL();
        const newPassword = document.getElementById("newPassword").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();
        const errorMsg = document.getElementById("errorMsg");

        // Validations
        if (!token) {
            showError("Invalid or missing reset token.");
            return;
        }
        if (!newPassword || !confirmPassword) {
            showError("Please fill in both fields.");
            return;
        }
        if (newPassword !== confirmPassword) {
            showError("Passwords do not match.");
            return;
        }
        if (newPassword.length < 6) {
            showError("Password must be at least 6 characters.");
            return;
        }

        fetch("http://localhost:8080/api/users/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, newPassword: newPassword })
        })
      // ✅ correct
.then(res => {
    if (!res.ok) throw new Error("Reset failed");
    return res.text();
})
        .then(() => {
            document.getElementById("successMsg").style.display = "block";
            errorMsg.style.display = "none";

            // Redirect after 2 seconds
            setTimeout(() => {
                window.location.href = "/homepage/index.html";
            }, 2000);
        })
        .catch(err => {
            showError("Reset link is invalid or expired. Please request a new one.");
        });
    }

    function showError(msg) {
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.textContent = "❌ " + msg;
        errorMsg.style.display = "block";
    }
</script>

</body>
</html>
