<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href = "style.css">
    <link rel = "stylesheet" href = "ayurvedic.css">
</head>
<body>
    <!-- Navbar -->
    <div id="navbar"></div>
<script>
  // Load navbar
  fetch("../navbar/nav.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("navbar").innerHTML = data;

      // ADD EVENT LISTENERS AFTER NAVBAR LOADS
      const openBtn = document.getElementById("openPopup");
      const popup = document.getElementById("loginPopup");
      const overlay = document.getElementById("overlay");

      openBtn.onclick = () => {
        popup.style.display = "flex";
        overlay.style.display = "block";
      };

      overlay.onclick = () => {
        popup.style.display = "none";
        overlay.style.display = "none";
      };
    });
</script>



  <div class="search-container" style="max-width:1200px;margin: 0 auto;">
    <input id="searchInput" placeholder="Search Ayurvedic products..." />
    <button id="searchBtn">Search</button>
  </div>

  <div id = "small_text">Compare prices from trusted online pharmacies</div>
  
  <main style="max-width:1200px;margin: 0 auto;">
    <div id="productList" class="product-container"></div>
  </main>

  <!-- Modal (hidden until opened) -->
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <div id="modalBody" class="modal-body">
      <p id="modalDescription" class="modal-desc"></p>

         <p id="lowestPriceTip" class="lowest-tip"></p>


        <!-- filled by JS -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer"></div>
    <!-- Load Footer -->
   <script>
     // Load Footer
  fetch("../footer/footer.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    });
   </script>


<script src = "ayurvedic.js"></script>
</body>
</html>
