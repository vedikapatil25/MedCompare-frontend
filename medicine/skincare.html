<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href = "../homepage/style.css">
    <link rel = "stylesheet" href = "ayurvedic.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
    <!-- Navbar -->
    <div id="navbar"></div>
    <script src="/navbar/nav.js"></script>

  <!--back button-->
  <div class="back-btn-wrapper">
    <button class="back-btn" onclick="history.back()">
      <i class="ti ti-arrow-left"></i> Back
    </button>
  </div>
    <div class="search-container" style="max-width:1200px;margin: 0 auto;">
      <input id="searchInput" placeholder="Search Ayurvedic products..." />
      <button id="searchBtn">Search</button>
    </div>

    <main style="max-width:1200px;margin: 0 auto;">
      <div id="productList" class="product-container"></div>
    </main>

  <!-- Modal (hidden until opened) -->
    <div id="modal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <div id="modalBody" class="modal-body">
          <p id="modalDescription" class="modal-desc"></p>
          <p id="lowestPriceTip" class="lowest-tip"></p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>
    <!-- Load Footer -->
      <script>
      // Load Footer
        fetch("../../footer/footer.html")
        .then(res => res.text())
        .then(data => {
        document.getElementById("footer").innerHTML = data;
        });
      </script>
      
  <script src = "skincare.js"></script>
</body>
</html>
