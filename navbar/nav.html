<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* --- Navbar --- */
nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 50px;
  background:#1e293b;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
}

.logo{
  color:#60a5fa;
  font-size:22px;
  /* font-weight:600; */
}

nav ul{
  display:flex;
  align-items:center;
  gap:25px;
  list-style:none;
}
nav a {
  color: #e2e8f0;
  text-decoration: none;
}
nav a:hover {
  color:#38bdf8;
}
body.light-mode a {
  color :#1e293b;
}
body.light-mode a:hover {
  color :#38bdf8;
}
nav li{
  cursor:pointer;
  transition:color 0.3s;
}

nav li:hover{
  color:#38bdf8;
}

.loginBtn{
  padding:8px 15px;
  border:none;
  background:#3b82f6;
  color:white;
  border-radius:6px;
  cursor:pointer;
}
/* ----------------------------------
   BLUR OVERLAY
---------------------------------- */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(8px);
  background: rgba(0,0,0,0.4);
  display: none;
  z-index: 10;
}

/* ----------------------------------
   LOGIN POPUP
---------------------------------- */
.login-popup {
  width: 60%;
  max-width: 850px;
  background: white;
  border-radius: 15px;
  display: flex;
  gap: 20px;
  padding: 20px;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
  z-index: 20;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
}

/* Left side */
.left-box {
  width: 45%;
  background: #1e3a8a;
  color: white;
  padding: 25px;
  border-radius: 12px;
}

.left-box span {
  font-size: 40px;
  font-weight: bold;
}

.left-box img {
  width: 100%;
  margin-top: 20px;
}

/* Right side */
.right-box {
  color: #0f172a;
  width: 55%;
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding-top: 10px;
}

.right-box input {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.otp-btn {
  padding: 12px;
  background: #1e3a8a;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 17px;
}

    </style>
</head>
<body>
    <!-- Navbar -->
  <nav id = "navbar">
    <h2 class="logo">MedCompare</h2>
    <ul>
      <li><a href="../homepage/index.html">Home</a></li>
      <li><a href="../medicine/index.html">Medicines</a></li>
      <!-- <li><a href="../labtests/index.html">Lab Tests</a></li> -->
      <li><a href="../footer/about.html">About</a></li>
      <li><button class="loginBtn" id="openPopup">Login</button></li>
    </ul>
  </nav>
  <!-- BLUR OVERLAY -->
  <div class="overlay" id="overlay"></div>

  <!-- LOGIN POPUP -->
  <div class="login-popup" id="loginPopup">
    <div class="left-box">
      <h2>Save Upto <span>51%</span></h2>
      <p>on medicines with Branded Substitutes</p>
      <img src="doctor.png" alt="Doctor Image">
    </div>

    <div class="right-box">
      <h2>MedCompare</h2>
      <p>Login / Signup</p>

      <input type="number" placeholder="Enter your 10-digit mobile number">

      <button class="otp-btn">Get OTP</button>

      <label>
        <input type="checkbox" checked>
        I agree to the <a href="#">Terms & Conditions</a>
      </label>
    </div>
  </div>


</body>
</html>
